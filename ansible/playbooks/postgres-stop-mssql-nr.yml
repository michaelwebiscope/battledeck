---
# Stop legacy PostgreSQL and enable New Relic nri-mssql monitoring.
- name: Stop PostgreSQL and instrument SQL Server in New Relic
  hosts: navalansible
  gather_facts: true
  tasks:
    - ansible.builtin.import_role:
        name: navalansible
        tasks_from: postgres_stop
    - ansible.builtin.import_role:
        name: navalansible
        tasks_from: newrelic_mssql_integration
