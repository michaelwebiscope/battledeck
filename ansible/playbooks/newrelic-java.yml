---
- name: New Relic - Java (NavalArchiveImagePopulator)
  hosts: navalansible
  gather_facts: false
  vars_files:
    - ../roles/navalansible/vars/main.yml
  tasks:
    - ansible.builtin.include_role:
        name: navalansible
        tasks_from: nr-java-service.yml
      when: newrelic_license_key is defined and newrelic_license_key | length > 0
