---
# PostgreSQL on-host DB monitoring only (nri-postgresql + new_relic DB user + config).
# Requires: newrelic-infra running, PostgreSQL on the VM.
#
# Usage (from repo root):
#   ./scripts/deploy-navalansible.sh -newrelic-only   # skips if password unset
# Or:
#   cd ansible && ../.venv/bin/python3 -m ansible playbook playbooks/newrelic-postgres-only.yml \
#     -e "ansible_host=<IP>" -e "vm_admin_password=..." -e "vm_admin_username=azureadmin" \
#     -e "newrelic_postgres_monitor_password=..."

- name: New Relic PostgreSQL DB monitoring
  hosts: navalansible
  gather_facts: true
  tasks:
    - ansible.builtin.include_role:
        name: navalansible
        tasks_from: newrelic_postgresql_integration
