---
# SQL Server (Express) SA password — used only during install/bootstrap
mssql_sa_password: ""
mssql_instance_name: "SQLEXPRESS"

# App DB login password — overridden by deploy script from terraform.tfvars pg_app_password
pg_app_password: ""

# Infinite Tracing (Trace Observer)
# Set these via terraform.tfvars and scripts/deploy-navalansible.sh (preferred).
# Examples:
#   newrelic_trace_observer_host = "....tracing.edge.nr-data.net"
#   newrelic_trace_observer_port = "4318"
newrelic_trace_observer_host: ""
newrelic_trace_observer_port: "4318"

# Paths
api_path: C:\inetpub\navalarchive-api
web_path: C:\inetpub\navalarchive-web
payment_path: C:\inetpub\navalarchive-payment
account_path: C:\inetpub\navalarchive-account
card_path: C:\inetpub\navalarchive-card
cart_path: C:\inetpub\navalarchive-cart
image_populator_path: C:\inetpub\navalarchive-imagepopulator
clone_path: C:\navalarchive-src
dotnet_dir: C:\Program Files\dotnet
node_dir: C:\Program Files\nodejs
image_populator_port: 5099

# Chain microservices: Csproj, Exe, Port, Service name, Path key for chain_paths lookup
chain_services:
  - { csproj: NavalArchive.Gateway.csproj, exe: NavalArchive.Gateway.exe, port: 5010, svc: NavalArchiveGateway, path_key: Gateway }
  - { csproj: NavalArchive.Auth.csproj, exe: NavalArchive.Auth.exe, port: 5011, svc: NavalArchiveAuth, path_key: Auth }
  - { csproj: NavalArchive.UserService.csproj, exe: NavalArchive.UserService.exe, port: 5012, svc: NavalArchiveUser, path_key: User }
  - { csproj: NavalArchive.Catalog.csproj, exe: NavalArchive.Catalog.exe, port: 5013, svc: NavalArchiveCatalog, path_key: Catalog }
  - { csproj: NavalArchive.Inventory.csproj, exe: NavalArchive.Inventory.exe, port: 5014, svc: NavalArchiveInventory, path_key: Inventory }
  - { csproj: NavalArchive.Basket.csproj, exe: NavalArchive.Basket.exe, port: 5015, svc: NavalArchiveBasket, path_key: Basket }
  - { csproj: NavalArchive.Order.csproj, exe: NavalArchive.Order.exe, port: 5016, svc: NavalArchiveOrder, path_key: Order }
  - { csproj: NavalArchive.Payment.csproj, exe: NavalArchive.Payment.exe, port: 5017, svc: NavalArchivePaymentChain, path_key: Payment }
  - { csproj: NavalArchive.Shipping.csproj, exe: NavalArchive.Shipping.exe, port: 5018, svc: NavalArchiveShipping, path_key: Shipping }
  - { csproj: NavalArchive.Notification.csproj, exe: NavalArchive.Notification.exe, port: 5019, svc: NavalArchiveNotification, path_key: Notification }
  # Card and Cart: same OTEL treatment as chain services above
  - { csproj: NavalArchive.CardService.csproj, exe: NavalArchive.CardService.exe, port: 5002, svc: NavalArchiveCard, path_key: Card }
  - { csproj: NavalArchive.CartService.csproj, exe: NavalArchive.CartService.exe, port: 5003, svc: NavalArchiveCart, path_key: Cart }

chain_paths:
  Gateway: C:\inetpub\navalarchive-gateway
  Auth: C:\inetpub\navalarchive-auth
  User: C:\inetpub\navalarchive-user
  Catalog: C:\inetpub\navalarchive-catalog
  Inventory: C:\inetpub\navalarchive-inventory
  Basket: C:\inetpub\navalarchive-basket
  Order: C:\inetpub\navalarchive-order
  Payment: C:\inetpub\navalarchive-payment-chain
  Shipping: C:\inetpub\navalarchive-shipping
  Notification: C:\inetpub\navalarchive-notification
  Card: C:\inetpub\navalarchive-card
  Cart: C:\inetpub\navalarchive-cart

iis_chain_services:
  - { site: NavalArchive-Gateway, apppool: NavalArchive-Gateway, svc: NavalArchiveGateway, exe: NavalArchive.Gateway.exe, port: 5010, path_key: Gateway }
  - { site: NavalArchive-Auth, apppool: NavalArchive-Auth, svc: NavalArchiveAuth, exe: NavalArchive.Auth.exe, port: 5011, path_key: Auth }
  - { site: NavalArchive-User, apppool: NavalArchive-User, svc: NavalArchiveUser, exe: NavalArchive.UserService.exe, port: 5012, path_key: User }
  - { site: NavalArchive-Catalog, apppool: NavalArchive-Catalog, svc: NavalArchiveCatalog, exe: NavalArchive.Catalog.exe, port: 5013, path_key: Catalog }
  - { site: NavalArchive-Inventory, apppool: NavalArchive-Inventory, svc: NavalArchiveInventory, exe: NavalArchive.Inventory.exe, port: 5014, path_key: Inventory }
  - { site: NavalArchive-Basket, apppool: NavalArchive-Basket, svc: NavalArchiveBasket, exe: NavalArchive.Basket.exe, port: 5015, path_key: Basket }

iis_hosted_service_names:
  - NavalArchiveGateway
  - NavalArchiveAuth
  - NavalArchiveUser
  - NavalArchiveCatalog
  - NavalArchiveInventory
  - NavalArchiveBasket

# New Relic .NET APM agent (trace chain: API + IIS microservices + Order/Payment/Shipping/Notification)
nr_dotnet_profiler_guid: "{36032161-FFC0-4B61-B559-F6C5D41BAE5A}"
nr_dotnet_profiler_path: 'C:\Program Files\New Relic\.NET Agent\NewRelic.Profiler.dll'

nr_dotnet_trace_chain_windows_services:
  - NavalArchiveOrder
  - NavalArchivePaymentChain
  - NavalArchiveShipping
  - NavalArchiveNotification

# OpenTelemetry (.NET auto-instrumentation) defaults for Card/Cart only
# Metrics and logs always go to standard NR OTLP ingest (otlp.nr-data.net).
# Traces go to Trace Observer when newrelic_trace_observer_host is set (per-signal override),
# otherwise fall back to the same standard endpoint.
otel_exporter_otlp_endpoint: "https://otlp.nr-data.net"
# Signal-specific traces endpoint MUST include /v1/traces (SDK does not append it).
# NR infinite tracing accepts HTTPS on port 443 (default when port omitted).
otel_exporter_otlp_traces_endpoint: "{% if newrelic_trace_observer_host is defined and newrelic_trace_observer_host | length > 0 %}https://{{ newrelic_trace_observer_host }}/v1/traces{% else %}https://otlp.nr-data.net/v1/traces{% endif %}"
otel_exporter_otlp_protocol: http/protobuf
otel_exporter_otlp_traces_protocol: http/protobuf
otel_dotnet_auto_home: C:\Program Files\OpenTelemetry .NET AutoInstrumentation
# Pin 1.9.0 for self-contained .NET 8 apps (1.11 requires DiagnosticSource 9.x).
otel_dotnet_auto_version: "1.9.0"

# Common OTEL .NET auto-instrumentation env vars (shared by Card, Cart, chain non-IIS services).
# Per-service vars (OTEL_SERVICE_NAME, OTEL_RESOURCE_ATTRIBUTES, OTEL_EXPORTER_OTLP_HEADERS,
# OTEL_EXPORTER_OTLP_TRACES_HEADERS when trace observer is configured) are set in newrelic-otel.yml.
otel_common_env_vars:
  - "OTEL_DOTNET_AUTO_HOME={{ otel_dotnet_auto_home }}"
  - "OTEL_EXPORTER_OTLP_ENDPOINT={{ otel_exporter_otlp_endpoint }}"
  - "OTEL_EXPORTER_OTLP_TRACES_ENDPOINT={{ otel_exporter_otlp_traces_endpoint }}"
  - "OTEL_EXPORTER_OTLP_PROTOCOL={{ otel_exporter_otlp_protocol }}"
  - "OTEL_EXPORTER_OTLP_TRACES_PROTOCOL={{ otel_exporter_otlp_traces_protocol }}"
  - "OTEL_TRACES_EXPORTER=otlp,console"
  - "OTEL_METRICS_EXPORTER=otlp"
  - "OTEL_LOGS_EXPORTER=otlp"
  - "OTEL_DOTNET_AUTO_TRACES_ENABLED=true"
  - "OTEL_DOTNET_AUTO_TRACES_ADDITIONAL_SOURCES=NavalArchive,MassTransit"
  - "OTEL_PROPAGATORS=tracecontext,baggage"
  - "OTEL_DOTNET_AUTO_METRICS_ENABLED=true"
  - "OTEL_DOTNET_AUTO_LOGS_ENABLED=true"
  - "CORECLR_ENABLE_PROFILING=1"
  - "CORECLR_PROFILER={918728DD-259F-4A6A-AC2B-B85E1B658318}"
  - "CORECLR_PROFILER_PATH_64={{ otel_dotnet_auto_home }}\\win-x64\\OpenTelemetry.AutoInstrumentation.Native.dll"
  - "COR_ENABLE_PROFILING=1"
  - "COR_PROFILER={918728DD-259F-4A6A-AC2B-B85E1B658318}"
  - "COR_PROFILER_PATH_64={{ otel_dotnet_auto_home }}\\win-x64\\OpenTelemetry.AutoInstrumentation.Native.dll"
  - "DOTNET_ADDITIONAL_DEPS={{ otel_dotnet_auto_home }}\\AdditionalDeps"
  - "DOTNET_SHARED_STORE={{ otel_dotnet_auto_home }}\\store"
  - "DOTNET_STARTUP_HOOKS={{ otel_dotnet_auto_home }}\\net\\OpenTelemetry.AutoInstrumentation.StartupHook.dll"

# New Relic PostgreSQL on-host integration (nri-postgresql).
# Set newrelic_postgres_monitor_password to create DB user + deploy postgresql-config.yml (see newrelic-infra.yml).
newrelic_postgres_monitor_password: ""
newrelic_postgres_hostname: "127.0.0.1"
newrelic_postgres_port: "5432"
newrelic_postgres_collection_list: '["postgres", "navalarchive", "navalarchive_logs"]'
newrelic_postgres_integration_env_label: "demo"

# New Relic Microsoft SQL Server on-host integration (nri-mssql).
# Set newrelic_mssql_monitor_password to create login new_relic + deploy mssql-config.yml.
newrelic_mssql_monitor_password: ""
newrelic_mssql_hostname: ""
newrelic_mssql_endpoint: ""
newrelic_mssql_port: ""
newrelic_mssql_integration_env_label: "demo"
newrelic_mssql_query_monitoring: true
newrelic_mssql_query_monitoring_dmv_only: false
newrelic_mssql_query_monitoring_fetch_interval_seconds: "15"
newrelic_mssql_query_monitoring_response_time_ms: "1"
newrelic_mssql_query_monitoring_count_threshold: "20"
newrelic_mssql_query_store_databases:
  - navalarchive
  - navalarchive_logs

# OpenTelemetry Collector Contrib sqlserver receiver → New Relic OTLP (see otel_mssql_collector.yml).
newrelic_mssql_otel_enabled: true
otelcol_contrib_version: "0.152.0"
otelcol_install_dir: 'C:\Program Files\OpenTelemetry Collector'
otelcol_mssql_service_name: otelcol-contrib-mssql

# New Relic Agent Control (fleet-managed infra agent).
# Set agent_control_enabled to true and provide fleet/org IDs to use Agent Control
# instead of the standalone newrelic-infra agent.
# client_id / client_secret are one-time tokens from the NR Fleet Control UI (expire 12h).
agent_control_enabled: false
agent_control_version: "1.14.0"
agent_control_fleet_id: ""
agent_control_org_id: ""
agent_control_client_id: ""
agent_control_client_secret: ""
agent_control_region: "us"

# RabbitMQ (MassTransit Order → PaymentChain distributed traces)
rabbitmq_enabled: true
rabbitmq_base_dir: "C:\\RabbitMQ"
rabbitmq_chocolatey_version: "3.13.7"
rabbitmq_host: "127.0.0.1"
rabbitmq_port: 5672
rabbitmq_username: "guest"
rabbitmq_password: "guest"
rabbitmq_virtual_host: "/"
rabbitmq_management_enabled: true

# HTTP trace chain: Payment → Shipping → Notification (/trace endpoints)
trace_chain_next_urls:
  NavalArchivePaymentChain: "http://localhost:5018"
  NavalArchiveShipping: "http://localhost:5019"
