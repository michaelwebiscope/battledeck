---
# Deploy nri-mssql config for New Relic infrastructure agent (Windows).
# Invoked from playbooks/newrelic-infra.yml or newrelic-mssql-only.yml.
# Requires: newrelic-infra running. Set newrelic_mssql_monitor_password in tfvars.

- name: New Relic Microsoft SQL Server on-host integration
  when: newrelic_mssql_monitor_password | default('') | length > 0
  block:
    - name: Detect nri-mssql integration binary
      ansible.windows.win_shell: |
        $candidates = @(
          'C:\Program Files\New Relic\newrelic-infra\newrelic-integrations\nri-mssql\nri-mssql.exe',
          'C:\Program Files\New Relic\newrelic-infra\integrations\nri-mssql\nri-mssql.exe'
        )
        foreach ($p in $candidates) { if (Test-Path $p) { Write-Output $p; exit 0 } }
        exit 1
      register: nri_mssql_binary
      failed_when: false
      changed_when: false

    - name: Install nri-mssql MSI (Windows amd64)
      when: nri_mssql_binary.rc != 0
      block:
        - name: Download nri-mssql MSI
          ansible.windows.win_get_url:
            url: "{{ newrelic_mssql_msi_url | default('https://github.com/newrelic/nri-mssql/releases/download/v2.30.0/nri-mssql-amd64.2.30.0.msi') }}"
            dest: C:\Windows\Temp\nri-mssql-amd64.msi

        - name: Run nri-mssql MSI installer
          ansible.windows.win_package:
            path: C:\Windows\Temp\nri-mssql-amd64.msi
            state: present
            arguments: /qn

    - name: Locate sqlcmd.exe for NR MSSQL bootstrap
      ansible.windows.win_shell: |
        $cmd = Get-ChildItem 'C:\Program Files\Microsoft SQL Server' -Recurse -Filter sqlcmd.exe -ErrorAction SilentlyContinue |
          Sort-Object FullName -Descending |
          Select-Object -First 1 -ExpandProperty FullName
        if (-not $cmd) { throw 'sqlcmd.exe not found' }
        Write-Output $cmd
      args:
        executable: powershell
      register: mssql_sqlcmd_path
      changed_when: false

    - name: Discover SQL Server TCP port when not set
      when: newrelic_mssql_port | default('') | length == 0
      ansible.windows.win_shell: |
        $instance = '{{ mssql_instance_name | default("SQLEXPRESS") }}'
        $key = Get-ChildItem 'HKLM:\SOFTWARE\Microsoft\Microsoft SQL Server' -ErrorAction SilentlyContinue |
          Where-Object { $_.PSChildName -like "MSSQL*$instance" } |
          Select-Object -First 1
        if (-not $key) { throw "Registry key for instance $instance not found" }
        $tcp = Get-ItemProperty -Path "$($key.PSPath)\MSSQLServer\SuperSocketNetLib\Tcp\IPAll" -ErrorAction Stop
        $port = $tcp.TcpPort
        if ([string]::IsNullOrWhiteSpace($port)) { $port = $tcp.TcpDynamicPorts }
        if ([string]::IsNullOrWhiteSpace($port)) { throw 'Could not read SQL Server TCP port from registry' }
        Write-Output $port.Trim()
      args:
        executable: powershell
      register: mssql_discovered_port
      changed_when: false

    - name: Set effective MSSQL port for New Relic
      ansible.builtin.set_fact:
        newrelic_mssql_port: "{{ newrelic_mssql_port | default(mssql_discovered_port.stdout | default('') | trim) }}"

    - name: Fail when MSSQL TCP port is unknown
      ansible.builtin.fail:
        msg: "Set newrelic_mssql_port in tfvars or ensure SQL Server TCP is enabled."
      when: newrelic_mssql_port | default('') | length == 0

    - name: Write SQL script for New Relic monitoring login (new_relic)
      ansible.windows.win_template:
        src: new_relic_mssql_monitor.sql.j2
        dest: C:\Windows\Temp\new_relic_mssql_monitor.sql

    - name: Apply New Relic monitoring login in SQL Server
      ansible.windows.win_shell: |
        $sqlcmd = '{{ mssql_sqlcmd_path.stdout | trim }}'
        $server = 'localhost\{{ mssql_instance_name | default("SQLEXPRESS") }}'
        & $sqlcmd -S $server -U sa -C -b -i 'C:\Windows\Temp\new_relic_mssql_monitor.sql'
      args:
        executable: powershell
      environment:
        SQLCMDPASSWORD: "{{ mssql_sa_password }}"

    - name: Ensure New Relic integrations.d directory exists
      ansible.windows.win_file:
        path: 'C:\Program Files\New Relic\newrelic-infra\integrations.d'
        state: directory

    - name: Deploy mssql-config.yml for New Relic
      ansible.windows.win_template:
        src: newrelic_mssql_config.yml.j2
        dest: 'C:\Program Files\New Relic\newrelic-infra\integrations.d\mssql-config.yml'

    - name: Dry-run nri-mssql integration (connectivity check)
      ansible.windows.win_shell: |
        $exe = @(
          'C:\Program Files\New Relic\newrelic-infra\newrelic-integrations\nri-mssql\nri-mssql.exe',
          'C:\Program Files\New Relic\newrelic-infra\integrations\nri-mssql\nri-mssql.exe'
        ) | Where-Object { Test-Path $_ } | Select-Object -First 1
        if (-not $exe) { throw 'nri-mssql.exe not found after install' }
        & $exe -hostname '{{ newrelic_mssql_hostname | default(ansible_hostname) }}' -port '{{ newrelic_mssql_port }}' -username new_relic -password '{{ newrelic_mssql_monitor_password }}' 2>&1 | Select-Object -First 5
      args:
        executable: powershell
      register: nri_mssql_test
      changed_when: false
      failed_when: false

    - name: Restart New Relic infrastructure agent to load MSSQL integration
      ansible.windows.win_service:
        name: newrelic-infra
        state: restarted
      ignore_errors: true

    - name: Report MSSQL integration status
      ansible.builtin.debug:
        msg: >-
          nri-mssql deployed (port={{ newrelic_mssql_port }}, host={{ newrelic_mssql_hostname | default('127.0.0.1') }}).
          Connectivity probe: {{ nri_mssql_test.stdout | default('') | trim }}
